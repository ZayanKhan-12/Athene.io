name: Swift - Build and Analyze

on:
  push:
    branches: [ "keys", "zayan", "main" ]
  pull_request:
    branches: [ "keys", "zayan", "main" ]

jobs:
  build:
    name: Build and analyse default scheme using xcodebuild command
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Swift
        uses: swift-actions/setup-swift@v1
        with:
          swift-version: "5.9"
          
      - name: Install Dependencies
        run: |
          cd AtheneNFT
          swift package resolve
          
      - name: Set Default Scheme
        run: |
          cd AtheneNFT
          scheme_list=$(xcodebuild -list -json | tr -d "\n")
          default=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
          echo $default | cat >default
          echo Using default scheme: $default
      - name: Build with Swift Package Manager
        run: |
          cd AtheneNFT
          swift build
          
      - name: Run Tests with Swift Package Manager
        run: |
          cd AtheneNFT
          swift test
          
      - name: Build with Xcode
        env:
          scheme: ${{ 'default' }}
        run: |
          cd AtheneNFT
          if [ $scheme = default ]; then scheme=$(cat default); fi
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then filetype_parameter="workspace" && file_to_build="`ls -A | grep -i \\.xcworkspace\$`"; else filetype_parameter="project" && file_to_build="`ls -A | grep -i \\.xcodeproj\$`"; fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          xcodebuild clean build analyze -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -destination "platform=iOS Simulator,name=iPhone 15" | xcpretty && exit ${PIPESTATUS[0]}
